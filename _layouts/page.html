---
layout: default
---
<div class="post">

  {% unless page.hide_title %}
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}<h5 class="post-description">{{ page.description }}</h5>{% endif %}
  </header>
  {% endunless %}

  <article class="post-content {{ page.title | slugify }} clearfix">
    {{ content }}
  </article>

</div>
