# Homepage highlights. Edit freely; every item is rendered by _includes/highlights.html.

research:
  - tag: PNAS 2026
    title: Social Media Promotion Improves Job Market Outcomes
    with: with Yan Chen, Alain Cohn, and Alvin E. Roth
    finding: A preregistered field experiment in the economics job market shows that promoting candidates' job market papers on social media to the right audience improves their real labor market outcomes.
    note: "Covered by the Financial Times, Michigan News, and New Things Under the Sun."
    links:
      - name: Paper
        url: https://www.pnas.org/doi/10.1073/pnas.2528289123
  - tag: ICLR 2026
    title: Counterfactual LLM-based Framework for Measuring Rhetorical Style
    with: with Hong Chen and Zongyi Li
    finding: Turns an LLM from an unreliable rater into a controlled measurement instrument. Across 8,485 ICLR submissions and 250,000+ counterfactual writings, promotional framing predicts citations and media attention beyond peer-review scores, and rises sharply after 2023 with LLM writing assistance.
    links:
      - name: arXiv
        url: https://arxiv.org/abs/2512.19908
  - tag: Working paper
    title: Perceived AI Use and Hiring Penalties
    with: with Qingyi Wang
    finding: In a hiring experiment for a real position, applicants suspected of using AI receive up to 40.6% lower evaluations whether or not they used it; recruiters detect AI use barely better than chance and infer lower ability, not lower effort.
    links:
      - name: SSRN
        url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5675322
  - tag: Ongoing &middot; Together AI
    title: Organizing Agent Swarms
    with: Frontier Agents team
    finding: How the organization of LLM agent collectives, model capability, reasoning, the agent harness, and the allocation of compute across agents shape multi-agent performance, including agents evaluating one another and agents in dynamic zero-sum games.

