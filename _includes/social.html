<div class="social">
  <span class="contacticon center">
    {% if site.email_user %}<a class="js-email" href="#" data-u="{{ site.email_user }}" data-d="{{ site.email_domain }}" title="Email" aria-label="Email"><i class="fas fa-envelope"></i></a>{% endif %}
    {% if site.scholar_userid %}<a href="https://scholar.google.com/citations?user={{ site.scholar_userid }}" target="_blank" rel="noopener" title="Google Scholar" aria-label="Google Scholar"><i class="ai ai-google-scholar"></i></a>{% endif %}
    {% if site.twitter_username %}<a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" rel="noopener" title="X (Twitter)" aria-label="X (Twitter)"><i class="fab fa-twitter"></i></a>{% endif %}
    {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>{% endif %}
    {% if site.linkedin_username %}<a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>{% endif %}
    {% if site.cv_pdf %}<a href="{{ site.cv_pdf | relative_url }}" target="_blank" rel="noopener" title="CV (PDF)" aria-label="CV (PDF)"><i class="fas fa-file-alt"></i></a>{% endif %}
  </span>
</div>
