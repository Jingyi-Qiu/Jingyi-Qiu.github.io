# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
# Layout and styling follow zongyi-li.github.io (al-folio v0.1 look).
# This site uses only features supported by GitHub Pages' built-in Jekyll build,
# so pushing to the publishing branch is all it takes to deploy (no Actions needed).

name: Jingyi Qiu
title: Jingyi Qiu
description: >
  Jingyi Qiu is a Ph.D. candidate at the University of Michigan School of Information
  studying how AI agents should be organized and evaluated, human-AI interaction,
  and AI in labor markets and hiring, using field and lab experiments, causal
  inference, and LLM-based measurement.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank" rel="noopener">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" target="_blank" rel="noopener">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>.

url: https://www.jingyiqiu.com # the base hostname & protocol for your site
baseurl: "" # empty: the site is served at the root of the custom domain

# Contact (shown obfuscated; the mailto link is assembled in the browser)
email_user: jaqiu
email_domain: umich.edu
email_display: jaqiu [at] umich [dot] edu

# CV PDF (replace the file in assets/pdf/ to update it)
cv_pdf: /assets/pdf/Jingyi_Qiu_CV.pdf
cv_updated: October 2026

# Social links (leave a value empty to hide its icon)
scholar_userid: IiLxFgYAAAAJ
twitter_username: JingyiQiu4
github_username: Jingyi-Qiu
linkedin_username:

# Open Graph / link previews
og_image: /assets/img/prof_pic.jpg

# Navigation bar, in order
nav:
  - title: About
    url: /
  - title: Publications
    url: /publications/
  - title: CV
    url: /cv/
  - title: Teaching
    url: /teaching/

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    output: false # news items are shown inline on the About page

news_limit: 8

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

include: ["_pages"]
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
